- name: fresh
  active: true
  path: ~/dev/fresh
  build: cargo build --release
  interval: 3600
- name: pueue
  active: false
  path: ~/dev/pueue
  build: ./inst.sh
  interval: 1200
- name: ComfyUI
  active: false
  path: ~/dev/ComfyUI
  pre-build: . venv/bin/activate
  build: pip3 install -r requirements.txt
  post-build: deactivate
  interval: 3600
- name: yt-dlp
  active: true
  path: ~/dev/yt-dlp
  git-remote-ref: origin/master
  git-pull: git pull origin master --ff-only
  build: make
  interval: 3600