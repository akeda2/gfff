- name: fresh
  active: true
  path: ~/dev/fresh
  build: ~/.cargo/bin/cargo build --release
  interval: 600
- name: yt-dlp
  active: true
  path: ~/dev/yt-dlp
  git-remote-ref: origin/master
  git-pull: git pull origin master --ff-only
  build: pipx install --force .
  manual-install-cmd: sudo make install
  interval: 3600
- name: btop
  active: true
  path: ~/dev/btop
  cleanup: gmake distclean
  build: gmake
  post-build: PREFIX="~/.local" gmake install
  manual-install-cmd: sudo gmake install
  interval: 3600
- name: gfff
  active: true
  path: ~/dev/gfff
  test: python3 -m unittest discover -s tests
  build: ./install-buildbot.sh
  interval: 3600
  