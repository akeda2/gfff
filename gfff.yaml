- name: fresh
  active: true
  path: ~/dev/fresh
  build: cargo build --release
  interval: 600
- name: pueue
  active: false
  path: ~/dev/pueue
  git-remote-ref: akeda/inst
  build: ./inst.sh
  interval: 1200
- name: yt-dlp
  active: true
  path: ~/dev/yt-dlp
  git-remote-ref: origin/master
  git-pull: git pull origin master --ff-only
  build: make
  interval: 3600
- name: btop
  active: true
  path: ~/dev/btop
  git-remote-ref: origin/master
  git-pull: git pull origin master --ff-only
  build: gmake
  interval: 3600