- name: fresh
  active: true
  path: ~/dev/fresh
  build: ~/.cargo/bin/cargo build --release
  interval: 600
- name: pueue
  active: false
  path: ~/dev/pueue
  git-remote-ref: akeda/inst
  build: ./inst.sh
  interval: 1200
- name: yt-dlp
  active: true
  path: ~/dev/yt-dlp
  git-remote-ref: origin/master
  git-pull: git pull origin master --ff-only
  build: make
  manual-install-cmd: sudo make install
  interval: 3600
- name: btop
  active: true
  path: ~/dev/btop
  build: gmake
  manual-install-cmd: sudo gmake install
  interval: 3600
- name: eb
  active: true
  path: ~/dev/eb
  git-remote-ref: origin/rework
  git-pull: git pull origin rework --ff-only
  test: make test && pytest -q --tb=short
  build: which -s pipx && pipx install .
  interval: 3600
- name: gfff
  active: true
  path: ~/dev/gfff
  test: python3 -m unittest discover -s tests
  build: ./install-buildbot.sh
  interval: 3600
- name: brec
  path: ~/dev/brec
  active: true
  test: ./inst.sh buildbot-check
  build: ./inst.sh buildbot --preserve-service-state
  at: 03:00